services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aetherflow
      POSTGRES_USER: aetherflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetherflow -d aetherflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: .
    working_dir: /app/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      AETHERFLOW_ENVIRONMENT: production
      AETHERFLOW_DATABASE_URL: postgresql+asyncpg://aetherflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/aetherflow
      AETHERFLOW_JWT_SECRET_KEY: ${AETHERFLOW_JWT_SECRET_KEY:?Set AETHERFLOW_JWT_SECRET_KEY in .env}
      AETHERFLOW_SECURE_COOKIES: "true"
      AETHERFLOW_KAFKA_ENABLED: "true"
      AETHERFLOW_PROVIDER_DEFAULT: ${AETHERFLOW_PROVIDER_DEFAULT:-mock}
      AETHERFLOW_PROVIDER_OPENAI_API_KEY: ${AETHERFLOW_PROVIDER_OPENAI_API_KEY:-}
      AETHERFLOW_PROVIDER_OPENAI_BASE_URL: ${AETHERFLOW_PROVIDER_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AETHERFLOW_PROVIDER_OPENAI_MAX_CONNECTIONS: ${AETHERFLOW_PROVIDER_OPENAI_MAX_CONNECTIONS:-10}
      AETHERFLOW_PROVIDER_OPENAI_TIMEOUT_SECONDS: ${AETHERFLOW_PROVIDER_OPENAI_TIMEOUT_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      AETHERFLOW_ENVIRONMENT: production
      AETHERFLOW_API_HOST: 0.0.0.0
      AETHERFLOW_API_PORT: "8000"
      AETHERFLOW_DATABASE_URL: postgresql+asyncpg://aetherflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/aetherflow
      AETHERFLOW_JWT_SECRET_KEY: ${AETHERFLOW_JWT_SECRET_KEY:?Set AETHERFLOW_JWT_SECRET_KEY in .env}
      AETHERFLOW_SECURE_COOKIES: "true"
      AETHERFLOW_CORS_ORIGINS: '${AETHERFLOW_CORS_ORIGINS:-["http://localhost:3000"]}'
      AETHERFLOW_DEMO_ENABLED: ${AETHERFLOW_DEMO_ENABLED:-false}
      AETHERFLOW_KAFKA_ENABLED: "true"
      AETHERFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AETHERFLOW_PROVIDER_DEFAULT: ${AETHERFLOW_PROVIDER_DEFAULT:-mock}
      AETHERFLOW_PROVIDER_OPENAI_API_KEY: ${AETHERFLOW_PROVIDER_OPENAI_API_KEY:-}
      AETHERFLOW_PROVIDER_OPENAI_BASE_URL: ${AETHERFLOW_PROVIDER_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AETHERFLOW_PROVIDER_OPENAI_MAX_CONNECTIONS: ${AETHERFLOW_PROVIDER_OPENAI_MAX_CONNECTIONS:-10}
      AETHERFLOW_PROVIDER_OPENAI_TIMEOUT_SECONDS: ${AETHERFLOW_PROVIDER_OPENAI_TIMEOUT_SECONDS:-60}
      AETHERFLOW_REDIS_ENABLED: "true"
      AETHERFLOW_REDIS_URL: redis://redis:6379/0
      AETHERFLOW_REDIS_MAX_CONNECTIONS: ${AETHERFLOW_REDIS_MAX_CONNECTIONS:-10}
      AETHERFLOW_REDIS_CONNECT_TIMEOUT_SECONDS: ${AETHERFLOW_REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      AETHERFLOW_REDIS_SOCKET_TIMEOUT_SECONDS: ${AETHERFLOW_REDIS_SOCKET_TIMEOUT_SECONDS:-1}
      AETHERFLOW_RATE_LIMIT_AUTH_REQUESTS: ${AETHERFLOW_RATE_LIMIT_AUTH_REQUESTS:-20}
      AETHERFLOW_RATE_LIMIT_API_REQUESTS: ${AETHERFLOW_RATE_LIMIT_API_REQUESTS:-120}
      AETHERFLOW_RATE_LIMIT_WINDOW_SECONDS: ${AETHERFLOW_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    command: ["python", "-m", "aetherflow.runtime.worker"]
    environment:
      AETHERFLOW_ENVIRONMENT: production
      AETHERFLOW_DATABASE_URL: postgresql+asyncpg://aetherflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/aetherflow
      AETHERFLOW_JWT_SECRET_KEY: ${AETHERFLOW_JWT_SECRET_KEY:?Set AETHERFLOW_JWT_SECRET_KEY in .env}
      AETHERFLOW_SECURE_COOKIES: "true"
      AETHERFLOW_KAFKA_ENABLED: "true"
      AETHERFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AETHERFLOW_PROVIDER_DEFAULT: ${AETHERFLOW_PROVIDER_DEFAULT:-mock}
      AETHERFLOW_PROVIDER_OPENAI_API_KEY: ${AETHERFLOW_PROVIDER_OPENAI_API_KEY:-}
      AETHERFLOW_PROVIDER_OPENAI_BASE_URL: ${AETHERFLOW_PROVIDER_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AETHERFLOW_PROVIDER_OPENAI_MAX_CONNECTIONS: ${AETHERFLOW_PROVIDER_OPENAI_MAX_CONNECTIONS:-10}
      AETHERFLOW_PROVIDER_OPENAI_TIMEOUT_SECONDS: ${AETHERFLOW_PROVIDER_OPENAI_TIMEOUT_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  outbox-publisher:
    build: .
    command: ["python", "-m", "aetherflow.runtime.outbox_publisher"]
    environment:
      AETHERFLOW_ENVIRONMENT: production
      AETHERFLOW_DATABASE_URL: postgresql+asyncpg://aetherflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/aetherflow
      AETHERFLOW_JWT_SECRET_KEY: ${AETHERFLOW_JWT_SECRET_KEY:?Set AETHERFLOW_JWT_SECRET_KEY in .env}
      AETHERFLOW_SECURE_COOKIES: "true"
      AETHERFLOW_KAFKA_ENABLED: "true"
      AETHERFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AETHERFLOW_OUTBOX_PUBLISHER_ID: compose-outbox-publisher
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  scheduler:
    build: .
    command: ["python", "-m", "aetherflow.runtime.scheduler"]
    environment:
      AETHERFLOW_ENVIRONMENT: production
      AETHERFLOW_DATABASE_URL: postgresql+asyncpg://aetherflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/aetherflow
      AETHERFLOW_JWT_SECRET_KEY: ${AETHERFLOW_JWT_SECRET_KEY:?Set AETHERFLOW_JWT_SECRET_KEY in .env}
      AETHERFLOW_SECURE_COOKIES: "true"
      AETHERFLOW_KAFKA_ENABLED: "true"
      AETHERFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AETHERFLOW_SCHEDULER_ENABLED: "true"
      AETHERFLOW_SCHEDULER_POLL_INTERVAL_SECONDS: ${AETHERFLOW_SCHEDULER_POLL_INTERVAL_SECONDS:-1}
      AETHERFLOW_SCHEDULER_BATCH_SIZE: ${AETHERFLOW_SCHEDULER_BATCH_SIZE:-100}
      AETHERFLOW_SCHEDULER_ID: ${AETHERFLOW_SCHEDULER_ID:-compose-scheduler}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
