services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aetherflow
      POSTGRES_USER: aetherflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetherflow -d aetherflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  migrate:
    build: .
    working_dir: /app/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      AETHERFLOW_ENVIRONMENT: production
      AETHERFLOW_DATABASE_URL: postgresql+asyncpg://aetherflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/aetherflow
      AETHERFLOW_JWT_SECRET_KEY: ${AETHERFLOW_JWT_SECRET_KEY:?Set AETHERFLOW_JWT_SECRET_KEY in .env}
      AETHERFLOW_SECURE_COOKIES: "true"
      AETHERFLOW_KAFKA_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      AETHERFLOW_ENVIRONMENT: production
      AETHERFLOW_API_HOST: 0.0.0.0
      AETHERFLOW_API_PORT: "8000"
      AETHERFLOW_DATABASE_URL: postgresql+asyncpg://aetherflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/aetherflow
      AETHERFLOW_JWT_SECRET_KEY: ${AETHERFLOW_JWT_SECRET_KEY:?Set AETHERFLOW_JWT_SECRET_KEY in .env}
      AETHERFLOW_SECURE_COOKIES: "true"
      AETHERFLOW_KAFKA_ENABLED: "true"
      AETHERFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    command: ["python", "-m", "aetherflow.runtime.worker"]
    environment:
      AETHERFLOW_ENVIRONMENT: production
      AETHERFLOW_DATABASE_URL: postgresql+asyncpg://aetherflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/aetherflow
      AETHERFLOW_JWT_SECRET_KEY: ${AETHERFLOW_JWT_SECRET_KEY:?Set AETHERFLOW_JWT_SECRET_KEY in .env}
      AETHERFLOW_SECURE_COOKIES: "true"
      AETHERFLOW_KAFKA_ENABLED: "true"
      AETHERFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  outbox-publisher:
    build: .
    command: ["python", "-m", "aetherflow.runtime.outbox_publisher"]
    environment:
      AETHERFLOW_ENVIRONMENT: production
      AETHERFLOW_DATABASE_URL: postgresql+asyncpg://aetherflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/aetherflow
      AETHERFLOW_JWT_SECRET_KEY: ${AETHERFLOW_JWT_SECRET_KEY:?Set AETHERFLOW_JWT_SECRET_KEY in .env}
      AETHERFLOW_SECURE_COOKIES: "true"
      AETHERFLOW_KAFKA_ENABLED: "true"
      AETHERFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AETHERFLOW_OUTBOX_PUBLISHER_ID: compose-outbox-publisher
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
